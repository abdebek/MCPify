name: Build and Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # Multi-target: net8.0;net9.0;net10.0
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore MCPify.slnx

    - name: Build
      run: dotnet build MCPify.slnx --configuration Release --no-restore

    - name: Test
      run: |
        dotnet test MCPify.slnx --configuration Release --no-build --verbosity normal \
          --filter "Category!=Playwright" \
          --logger "console;verbosity=detailed"

    - name: Pack
      run: dotnet pack MCPify/MCPify.csproj --configuration Release --no-build --output ./artifacts

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: |
          ./artifacts/*.nupkg
          ./artifacts/*.snupkg
